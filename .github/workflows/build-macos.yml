name: Build macOS app
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install -r requirements.txt
      - run: python build_app.py
      - run: ditto -c -k --sequesterRsrc --keepParent 'dist/Network Drive Manager.app' 'dist/Network-Drive-Manager-macOS.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: Network-Drive-Manager-macOS
          path: dist/Network-Drive-Manager-macOS.zip
